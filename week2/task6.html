<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
</head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password"><br><br>

    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <p>Interests:</p>
    <input type="checkbox" id="gaming" name="interests" value="gaming">
    <label for="gaming">Gaming</label><br>
    <input type="checkbox" id="music" name="interests" value="music">
    <label for="music">Playing Instruments</label><br>
    <input type="checkbox" id="coding" name="interests" value="coding">
    <label for="coding">Coding</label><br><br>

    <label for="department">Department:</label><br>
    <select id="department" name="department">
      <option value="it">Information Technology</option>
      <option value="cs">Computer Science</option>
      <option value="ba">Business Administration</option>
    </select><br><br>

    <label for="about">About You:</label><br>
    <textarea id="about" name="about" rows="4" cols="40" placeholder="Tell us about yourself"></textarea><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
