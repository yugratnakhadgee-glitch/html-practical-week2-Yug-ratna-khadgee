<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timetable</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background-color: #4682B4; color: white; }
  </style>
</head>
<body>
  <h1>Weekly Class Timetable</h1>
  <table>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
    </tr>
    <tr>
      <td>9:00 - 10:00</td>
      <td>Python</td>
      <td>Web Technology</td>
      <td>Networks</td>
      <td>DBMS</td>
      <td>Python</td>
    </tr>
    <tr>
      <td>10:00 - 11:00</td>
      <td>Web Technology</td>
      <td>Python</td>
      <td>DBMS</td>
      <td>Networks</td>
      <td>Web Technology</td>
    </tr>
    <tr>
      <td colspan="6">Lunch Break</td>
    </tr>
    <tr>
      <td>12:00 - 1:00</td>
      <td>Networks Lab</td>
      <td>DBMS Lab</td>
      <td>Python Lab</td>
      <td>Web Lab</td>
      <td>Project Work</td>
    </tr>
  </table>
</body>
</html>
