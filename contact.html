<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Yug Ranta Khadgee</title>
  
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #4682B4; color: white; padding: 15px; }
    nav a { color: white; margin-right: 15px; text-decoration: none; }
    main { padding: 20px; }
    footer { background: #333; color: white; text-align: center; padding: 10px; }
    input, textarea { display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Your message"></textarea>

        <input type="submit" value="Send">
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Yug Ranta Khadgee</p>
  </footer>
</body>
</html>
